<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Vocab Defender</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #c { display: block; width: 100vmin; height: 75vmin; max-width: 100vw; max-height: 100vh;
       touch-action: none; box-shadow: 0 0 60px rgba(0,0,0,0.6); cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../js/engine-common.js"></script>
<script>
(function () {
  "use strict";
  const E = window.VocabEngine;

  const launch = E.readLaunch() || { vocab: [], fromLang: "Word", toLang: "Meaning", accent: "#12b886" };
  const Sfx = E.sfx({ enabled: launch.sound !== false });
  let VOCAB = E.shuffle(launch.vocab || []);
  const FROM = launch.fromLang || "Word";
  const TO = launch.toLang || "Meaning";
  const ACCENT = launch.accent || "#12b886";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 800, H = 600;
  // crisp at any screen size: backing store = real on-screen pixels, drawing
  // stays in logical 800x600 units (see E.fitCanvas)
  function resize() { E.fitCanvas(canvas, ctx, W, H); }
  window.addEventListener("resize", resize); resize();

  // ---- state ----
  let state = "menu";
  let score = 0, lives = 3, correct = 0, combo = 0, speedLevel = 0;
  let scrollX = 0, totalLanders = 0, wordsLeft = 0, wordsAnswered = 0, gameTime = 0;
  let vocabIdx = 0;
  let turret = null, bullets = [], landers = [], mbullets = [], particles = [], flashRect = null;
  let quizLander = null, awaitingAnswer = false;
  let mouseX = W / 2, mouseY = 80, mouseDown = false;
  const SPEED_THR = [120, 300, 520, 800, 1100];
  // Difficulty ramps SMOOTHLY with score — no jarring per-level jumps. The further you
  // get, the faster the planet scrolls, the faster landers descend, and the faster
  // marauders chase and shoot. Every cleared wave also adds one more lander.
  const DIFF_CAP = 2400;
  function diff() { return Math.min(1, score / DIFF_CAP); }
  let waveNo = 0;
  const HS_KEY = "vocabarcade.defender.highscore";
  let highscore = 0, lastWin = false;
  try { highscore = parseInt(localStorage.getItem(HS_KEY) || "0", 10) || 0; } catch (_) {}
  function saveHighscore(s) { try { localStorage.setItem(HS_KEY, String(s)); } catch (_) {} }

  function emitHud() { E.send(E.MSG.HUD, { score, lives, correct, combo, level: speedLevel }); }
  function flash(color, a) { flashRect = { color, a }; }
  function addScore(p) {
    score += p;
    if (speedLevel < SPEED_THR.length && score >= SPEED_THR[speedLevel]) { speedLevel++; flash("#8a3ffc", 0.26); }
    emitHud();
  }

  // ---- input ----
  const keys = {};
  function canvasCoords(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const cw = r.width || W, ch = r.height || H;
    return { x: (clientX - r.left) * (W / cw), y: (clientY - r.top) * (H / ch) };
  }
  function aimAt(px, py) { if (turret) turret.angle = Math.atan2(py - turret.y, px - turret.x); }
  function onPointerMove(e) {
    const p = canvasCoords(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;
    if (state === "playing") aimAt(mouseX, mouseY);
  }
  function onPointerDown(e) {
    const p = canvasCoords(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;
    if (state === "menu" || state === "over") { startGame(); return; }
    if (state === "playing" && turret) {
      aimAt(mouseX, mouseY);
      mouseDown = true;
      fireBullet();
    }
  }
  function onPointerUp() { mouseDown = false; }

  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === " ") e.preventDefault();
    if (state === "menu" || state === "over") startGame();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  E.listen(function (msg) {
    if (msg.type === E.MSG.START) startGame();
    else if (msg.type === E.MSG.PAUSE) { if (state === "playing") state = "paused"; }
    else if (msg.type === E.MSG.RESUME) { if (state === "paused") state = "playing"; }
    else if (msg.type === E.MSG.QUIT) state = "menu";
    else if (msg.type === E.MSG.ANSWER) onAnswer(msg.correct);
  });

  // the game-over screen stays up for a moment — a stray smartboard tap must not
  // skip past it (see E.overGuard in engine-common)
  const OverLock = E.overGuard(2000);
  function startGame() {
    if (OverLock.live()) return;
    VOCAB = E.shuffle(launch.vocab || []);   // fresh question order on every run / restart
    score = 0; lives = 3; correct = 0; combo = 0; speedLevel = 0;
    scrollX = 0; bullets = []; mbullets = []; particles = []; flashRect = null;
    awaitingAnswer = false; quizLander = null; mouseDown = false;
    vocabIdx = 0; wordsAnswered = 0; wordsLeft = VOCAB.length;
    waveNo = 0;
    turret = makeTurret();
    spawnWave();
    state = "playing";
    emitHud();
  }

  function makeTurret() {
    return { x: W / 2, y: H - 46, r: 16, angle: -Math.PI / 2, cd: 0, invuln: 1.2, alive: true };
  }

  // world-space x -> screen x (the planet scrolls left under the player)
  function sx(wx) { let s = ((wx - scrollX) % W + W) % W; return s; }

  function makeLander(x, y, edu, word, correctAns, options) {
    return {
      x: x, y: y, vx: (Math.random() - 0.5) * 24, vy: (26 + Math.random() * 14) * (1 + diff() * 0.55),
      r: 15, alive: true, isMutant: false, edu: edu, word: word, correct: correctAns, options: options,
      phase: Math.random() * 6.28, shootCd: Math.random() * 1.5,
    };
  }

  function spawnWave() {
    landers = [];
    const n = Math.min(13, 6 + waveNo);      // every cleared wave brings one more lander
    // roughly one in seven landers carries a word; cycle through the topic so
    // every word is eventually presented across waves
    const eduCount = VOCAB.length > 0 ? Math.max(1, Math.round(n / 7)) : 0;
    const eduSlots = E.shuffle(Array.from({ length: n }, function (_, i) { return i; })).slice(0, Math.min(eduCount, n));
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W;
      const y = H * (0.12 + Math.random() * 0.30);
      let edu = false, word = "", correctAns = "", opts = [];
      if (VOCAB.length > 0 && eduSlots.indexOf(i) !== -1) {
        const e = VOCAB[vocabIdx % VOCAB.length]; vocabIdx++;
        edu = true; word = e.from; correctAns = e.correct; opts = E.buildOptions(e).options;
      }
      landers.push(makeLander(x, y, edu, word, correctAns, opts));
    }
    totalLanders = n;
    waveNo++;
  }

  function respawnWaveIfNeeded() {
    if (aliveLanders() > 0) return false;
    if (wordsLeft > 0) { spawnWave(); return false; }   // more words to learn -> next wave
    gameOver(true); return true;                         // cleared everything + all words answered
  }

  function spawnParticles(x, y, color, count) {
    count = count || 12;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 130;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20, life: 0.45, age: 0, color, size: 2 + Math.random() * 3 });
    }
  }

  function fireBullet() {
    if (!turret || turret.cd > 0 || !turret.alive) return;
    const d = turret.angle;
    const nx = turret.x + Math.cos(d) * (turret.r + 6);
    const ny = turret.y + Math.sin(d) * (turret.r + 6);
    const BS = 620;
    bullets.push({ x: nx, y: ny, vx: Math.cos(d) * BS, vy: Math.sin(d) * BS, r: 3, life: 1.4 });
    turret.cd = 0.22;
    Sfx.shoot();
  }

  function aliveLanders() { return landers.filter(function (l) { return l.alive; }).length; }

  function onAnswer(isCorrect) {
    awaitingAnswer = false;
    const L = quizLander; quizLander = null;
    if (!L) { state = "playing"; return; }
    if (isCorrect) {
      correct++; combo++; addScore(20);
      if (combo >= 2) addScore((combo - 1) * 10);
      flash("#22c55e", 0.3);
      E.send(E.MSG.EVENT, { name: "correct" });
      L.alive = false; spawnParticles(sx(L.x), L.y, "#ffd56b", 14);
      wordsAnswered++; wordsLeft = VOCAB.length - wordsAnswered;
      emitHud();
      if (respawnWaveIfNeeded()) return;   // all waves cleared + words answered -> win
      state = "playing";              // resume (fixes freeze-after-answer)
    } else {
      combo = 0; lives--; flash("#ef4444", 0.42);
      E.send(E.MSG.EVENT, { name: "wrong" });
      emitHud();
      if (lives <= 0) { gameOver(false); return; }
      // educational lander stays alive — shoot it again to retry the word
      state = "playing";
    }
  }

  function gameOver(win) {
    state = "over"; OverLock.arm(); lastWin = win; bullets = []; mbullets = [];
    if (score > highscore) { highscore = score; saveHighscore(highscore); }
    E.send(E.MSG.RESULT, { win, score, correct, total: totalLanders });
    E.send(E.MSG.EVENT, { name: win ? "win" : "lose" });
    flash(win ? "#eab308" : "#ef4444", 0.5);
  }

  function update(dt) {
    if (state !== "playing") return;
    gameTime += dt;
    const scrollSpeed = 42 + diff() * 78;
    scrollX += scrollSpeed * dt;

    // turret tracks the cursor; fire while the button (or space) is held
    if (turret && turret.alive) {
      aimAt(mouseX, mouseY);
      if (turret.cd > 0) turret.cd -= dt;
      if (turret.invuln > 0) turret.invuln -= dt;
      if (mouseDown || keys[" "]) fireBullet();
    }

    // ---- bullets ----
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -8 || b.x > W + 8 || b.y < -8 || b.y > H + 8) { bullets.splice(i, 1); continue; }
      let hit = false;
      for (const L of landers) {
        if (!L.alive) continue;
        const lx = sx(L.x);
        if (Math.hypot(b.x - lx, b.y - L.y) < L.r + b.r) {
          hit = true;
          if (L.edu) {
            awaitingAnswer = true; quizLander = L; state = "paused";
            E.send(E.MSG.ASK, { word: L.word, correct: L.correct, options: L.options });
            Sfx.edu();
          } else {
            L.alive = false; spawnParticles(lx, L.y, "#9aa6c4", 10); addScore(L.isMutant ? 25 : 15);
            Sfx.explode();
            if (respawnWaveIfNeeded()) return;   // wave cleared + game won -> stop the frame
          }
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    // ---- landers / mutants ----
    for (const L of landers) {
      if (!L.alive) continue;
      L.phase += dt * 4;
      if (!L.isMutant) {
        L.x += L.vx * dt; L.y += L.vy * dt;
        // reach the ground (the turret) -> mutate into a marauder
        if (L.y > H - 90) { L.isMutant = true; L.vy = 0; spawnParticles(sx(L.x), L.y, "#ff5964", 10); }
      } else {
        // chase the turret
        const lx = sx(L.x), ly = L.y;
        const dx = turret.x - lx, dy = turret.y - ly;
        const d = Math.hypot(dx, dy) || 1;
        const sp = 95 + diff() * 75;
        L.x += (dx / d) * sp * dt;
        L.y += (dy / d) * sp * dt;
        if (L.y < 20) L.y = 20; if (L.y > H - 20) L.y = H - 20;
        // fire at the turret
        L.shootCd -= dt;
        if (L.shootCd <= 0 && turret.alive) {
          L.shootCd = Math.max(0.75, 1.6 - diff() * 0.85);
          const mdx = turret.x - lx, mdy = turret.y - ly, md = Math.hypot(mdx, mdy) || 1;
          const MS = 230 + diff() * 90;
          mbullets.push({ x: lx, y: ly, vx: (mdx / md) * MS, vy: (mdy / md) * MS, r: 4, life: 3 });
        }
      }
    }

    // ---- mutant bullets ----
    for (let i = mbullets.length - 1; i >= 0; i--) {
      const m = mbullets[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt;
      if (m.life <= 0 || m.x < -10 || m.x > W + 10 || m.y < -10 || m.y > H + 10) { mbullets.splice(i, 1); continue; }
      if (turret.alive && turret.invuln <= 0 && Math.hypot(m.x - turret.x, m.y - turret.y) < turret.r + m.r) {
        mbullets.splice(i, 1);
        loseLife();
        // loseLife() resets mbullets/bullets, so stop this frame
        return;
      }
    }

    // ---- mutant vs turret ----
    if (turret.alive && turret.invuln <= 0) {
      for (const L of landers) {
        if (!L.alive || !L.isMutant) continue;
        const lx = sx(L.x);
        if (Math.hypot(lx - turret.x, L.y - turret.y) < turret.r + L.r * 0.85) {
          spawnParticles(lx, L.y, "#9aa6c4", 10);
          L.alive = false;
          loseLife();
          break;
        }
      }
    }

    // ---- particles ----
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.age += dt; p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.age >= p.life) particles.splice(i, 1);
    }
  }

  function loseLife() {
    lives--; combo = 0; flash("#ef4444", 0.42); emitHud();
    Sfx.explode();
    if (lives <= 0) { gameOver(false); return; }
    turret = makeTurret(); turret.invuln = 1.8; bullets = []; mbullets = [];
  }

  // ---- decorative background + scenery (visual only; never affects gameplay) ----
  const bgStars = [], bgHaze = [], bgShooters = [];
  let bgTime = 0;
  const PLANET = { x0: 240, y: 158, r: 88 };
  const MOON = { x0: 655, y: 104, r: 24 };
  function initBackground() {
    bgStars.length = 0; bgHaze.length = 0;
    for (let i = 0; i < 150; i++) {
      bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.5 + Math.random() * 1.6,
                     depth: 0.12 + Math.random() * 0.88, tw: Math.random() * 6.28 });
    }
    for (let i = 0; i < 24; i++) {
      bgHaze.push({ x: Math.random() * W, y: Math.random() * H, r: 26 + Math.random() * 60,
                    a: 0.015 + Math.random() * 0.035, c: i % 3 });
    }
  }
  initBackground();

  function wrapX(v, span) { return ((v % span) + span) % span; }

  function drawGround() {
    ctx.fillStyle = "#151b2b"; ctx.fillRect(0, H - 26, W, 26);
    // horizon glow
    ctx.globalAlpha = 0.5;
    const gg = ctx.createLinearGradient(0, H - 34, 0, H - 20);
    gg.addColorStop(0, "rgba(18,184,134,0)"); gg.addColorStop(1, "rgba(18,184,134,0.5)");
    ctx.fillStyle = gg; ctx.fillRect(0, H - 34, W, 14);
    ctx.globalAlpha = 1;
    // scrolling surface plates
    const off = (scrollX * 0.6) % 26;
    for (let x = -26; x < W + 26; x += 26) {
      ctx.fillStyle = "rgba(38,47,68,0.95)"; ctx.fillRect(x - off, H - 26, 15, 5);
      ctx.fillStyle = "rgba(50,62,88,0.7)"; ctx.fillRect(x - off + 4, H - 19, 8, 3);
    }
    ctx.fillStyle = "rgba(120,150,200,0.35)"; ctx.fillRect(0, H - 26, W, 1.5);
  }

  function drawPlanet(x, y, r) {
    ctx.globalAlpha = 0.10; ctx.fillStyle = "#6f8cff";
    ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // ring sits BEHIND the planet disc
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.32); ctx.scale(1, 0.30);
    ctx.strokeStyle = "rgba(196,210,248,0.42)"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(150,170,220,0.28)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.68, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // body + cloud bands (clipped to the disc) + terminator
    ctx.fillStyle = "#2b3a63";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "rgba(122,152,232,0.26)"; ctx.fillRect(x - r, y - r * 0.62, r * 2, r * 0.30);
    ctx.fillStyle = "rgba(74,100,170,0.32)"; ctx.fillRect(x - r, y - r * 0.14, r * 2, r * 0.30);
    ctx.fillStyle = "rgba(150,180,255,0.16)"; ctx.fillRect(x - r, y + r * 0.36, r * 2, r * 0.24);
    ctx.fillStyle = "rgba(4,8,18,0.55)";
    ctx.beginPath(); ctx.arc(x + r * 0.6, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(180,205,255,0.32)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawMoon(x, y, r) {
    ctx.fillStyle = "#57618a";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    ctx.beginPath(); ctx.arc(x - r * 0.28, y - r * 0.3, r * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(26,32,50,0.32)";
    ctx.beginPath(); ctx.arc(x + r * 0.32, y + r * 0.2, r * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * 0.16, y + r * 0.42, r * 0.10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(150,172,220,0.22)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawRidge(par, baseY, color, amp) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const t = (x + scrollX * par) * 0.012;
      const y = baseY - (Math.sin(t) * 0.55 + Math.sin(t * 2.3) * 0.3 + Math.sin(t * 0.7) * 0.2 + 1) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  function drawBackground(dt) {
    bgTime += dt;
    ctx.fillStyle = "#070b16"; ctx.fillRect(0, 0, W, H);

    // nebula haze — radial-gradient blobs so they fade out softly (no hard-edged discs)
    for (let i = 0; i < bgHaze.length; i++) {
      const h = bgHaze[i];
      const hx = wrapX(h.x - scrollX * 0.05, W);
      const col = h.c === 0 ? "59,42,107" : (h.c === 1 ? "18,56,79" : "42,31,77");
      const rg = ctx.createRadialGradient(hx, h.y, 0, hx, h.y, h.r);
      rg.addColorStop(0, "rgba(" + col + "," + h.a + ")");
      rg.addColorStop(1, "rgba(" + col + ",0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(hx, h.y, h.r, 0, Math.PI * 2); ctx.fill();
    }

    // distant ringed planet + moon (slow parallax)
    drawPlanet(wrapX(PLANET.x0 - scrollX * 0.06, W + 360) - 180, PLANET.y, PLANET.r);
    drawMoon(wrapX(MOON.x0 - scrollX * 0.12, W + 180) - 90, MOON.y, MOON.r);

    // starfield — deeper stars are brighter and twinkle
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const x = wrapX(s.x - scrollX * 0.10 * s.depth, W);
      const tw = 0.55 + 0.45 * Math.sin(bgTime * 2.2 + s.tw);
      ctx.globalAlpha = (0.20 + 0.70 * s.depth) * tw;
      ctx.fillStyle = s.depth > 0.7 ? "#e2eaff" : "#9db0d8";
      ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // occasional shooting star
    if (Math.random() < dt * 0.4) {
      bgShooters.push({ x: W * (0.35 + Math.random() * 0.6), y: Math.random() * H * 0.42,
                        len: 60 + Math.random() * 90, sp: 430 + Math.random() * 360, age: 0, life: 1 });
    }
    for (let i = bgShooters.length - 1; i >= 0; i--) {
      const sh = bgShooters[i];
      sh.age += dt; sh.x -= sh.sp * dt; sh.y += sh.sp * 0.26 * dt;
      const a = Math.max(0, 1 - sh.age / sh.life);
      const g = ctx.createLinearGradient(sh.x, sh.y, sh.x + sh.len, sh.y - sh.len * 0.26);
      g.addColorStop(0, "rgba(255,255,255," + (0.9 * a) + ")"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x + sh.len, sh.y - sh.len * 0.26); ctx.stroke();
      if (sh.age >= sh.life) bgShooters.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    // far terrain ridges (behind the play surface)
    drawRidge(0.28, H - 64, "#121a2b", 42);
    drawRidge(0.52, H - 44, "#18202f", 26);
  }

  // ---- alien ships (drawn in a context already translated to the ship) ----
  function drawLander(L) {
    const r = L.r;
    const beam = (Math.sin(L.phase * 1.6) + 1) * 0.5;
    // tractor beam first, so it sits BEHIND the hull
    const bw = r * (0.34 + beam * 0.16);
    const bg = ctx.createLinearGradient(0, r * 0.4, 0, r * 0.4 + 30 + beam * 14);
    bg.addColorStop(0, "rgba(226,196,255,0.55)");
    bg.addColorStop(1, "rgba(176,107,255,0)");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-bw, r * 0.4);
    ctx.lineTo(bw, r * 0.4);
    ctx.lineTo(bw * 1.9, r * 0.4 + 30 + beam * 14);
    ctx.lineTo(-bw * 1.9, r * 0.4 + 30 + beam * 14);
    ctx.closePath(); ctx.fill();
    // glass dome + pilot
    ctx.fillStyle = "#d9c2ff";
    ctx.beginPath(); ctx.ellipse(0, -r * 0.26, r * 0.52, r * 0.5, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath(); ctx.ellipse(-r * 0.16, -r * 0.4, r * 0.15, r * 0.17, 0, 0, Math.PI * 2); ctx.fill();
    const eye = 0.55 + 0.45 * (Math.sin(L.phase * 3) + 1) * 0.5;
    ctx.fillStyle = "rgba(255,90,150," + eye + ")";
    ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.28, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.28, 2.1, 0, Math.PI * 2); ctx.fill();
    // saucer hull (rim + upper deck)
    ctx.fillStyle = "#8f4be0";
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.46, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b06bff";
    ctx.beginPath(); ctx.ellipse(0, -r * 0.07, r * 0.9, r * 0.33, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(232,214,255,0.5)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.46, 0, 0, Math.PI * 2); ctx.stroke();
    // blinking rim lights
    for (let k = 0; k < 5; k++) {
      const px = (-1 + k * 0.5) * r * 0.78;
      const on = (Math.sin(L.phase * 4 + k * 1.3) + 1) * 0.5;
      ctx.fillStyle = "rgba(255,235,150," + (0.25 + on * 0.75) + ")";
      ctx.beginPath(); ctx.arc(px, r * 0.2, 1.7, 0, Math.PI * 2); ctx.fill();
    }
    // claw emitters
    ctx.fillStyle = "#e9d4ff";
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.44, r * 0.28);
      ctx.lineTo(s * r * 0.68, r * 0.66);
      ctx.lineTo(s * r * 0.28, r * 0.5);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawMarauder(L) {
    const r = L.r;
    const flick = 0.6 + 0.4 * Math.sin(L.phase * 9);
    // turn the ship so it always faces the turret it is hunting
    ctx.rotate(Math.atan2((H - 46) - L.y, (W / 2) - sx(L.x)));
    // rear exhaust plume (points backwards)
    ctx.fillStyle = "rgba(255,150,80," + (0.5 * flick) + ")";
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, -r * 0.22); ctx.lineTo(-r * 0.9, r * 0.22);
    ctx.lineTo(-r * 1.7 - 6 * flick, 0); ctx.closePath(); ctx.fill();
    // swept wings
    ctx.fillStyle = "#c62b3c";
    ctx.beginPath();
    ctx.moveTo(r * 0.2, 0);
    ctx.lineTo(-r * 0.5, -r * 0.95); ctx.lineTo(-r * 0.95, -r * 0.85);
    ctx.lineTo(-r * 0.32, 0);
    ctx.lineTo(-r * 0.95, r * 0.85); ctx.lineTo(-r * 0.5, r * 0.95);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,160,170,0.5)"; ctx.lineWidth = 1.1; ctx.stroke();
    // fuselage
    ctx.fillStyle = "#ff5964";
    ctx.beginPath();
    ctx.moveTo(r * 1.05, 0);
    ctx.lineTo(r * 0.1, -r * 0.34); ctx.lineTo(-r * 0.82, -r * 0.26);
    ctx.lineTo(-r * 0.82, r * 0.26); ctx.lineTo(r * 0.1, r * 0.34);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath(); ctx.moveTo(r * 1.0, 0); ctx.lineTo(r * 0.1, -r * 0.3); ctx.lineTo(r * 0.1, 0); ctx.closePath(); ctx.fill();
    // glowing eye / core
    const eye = 0.55 + 0.45 * (Math.sin(L.phase * 5) + 1) * 0.5;
    ctx.shadowColor = "#ff2d4d"; ctx.shadowBlur = 10 * eye;
    ctx.fillStyle = "rgba(255,60,90," + (0.6 + eye * 0.4) + ")";
    ctx.beginPath(); ctx.arc(r * 0.34, 0, r * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ---- drawing ----
  function draw(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackground(dt);
    drawGround();

    // landers / marauders
    for (const L of landers) {
      if (!L.alive) continue;
      const lx = sx(L.x);
      ctx.save(); ctx.translate(lx, L.y);
      if (L.isMutant) drawMarauder(L);
      else drawLander(L);
      ctx.restore();
      if (L.edu) {
        const pr = 6 + (Math.sin(L.phase) + 1) * 1.5;
        const halo = 0.22 + 0.34 * (Math.sin(L.phase * 2) + 1) * 0.5;
        ctx.strokeStyle = "rgba(255,210,40," + halo + ")"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(lx, L.y, pr + 7, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(255,210,40,0.95)"; ctx.beginPath(); ctx.arc(lx, L.y, pr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1a1200"; ctx.font = "bold 12px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("?", lx, L.y + 1);
      }
    }

    // mutant bullets
    ctx.fillStyle = "#ff8a8a";
    for (const m of mbullets) { ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); }

    // player bullets
    ctx.fillStyle = "#bff7e3";
    for (const b of bullets) ctx.fillRect(b.x - 3, b.y - 2, 6, 4);

    // turret
    if (turret && turret.alive) {
      const blink = turret.invuln > 0 && (Math.floor(turret.invuln * 12) % 2 === 0);
      if (!blink) {
        // base
        ctx.fillStyle = "#3a4668";
        ctx.beginPath();
        ctx.moveTo(turret.x - 16, H - 24);
        ctx.lineTo(turret.x + 16, H - 24);
        ctx.lineTo(turret.x + 10, H - 44);
        ctx.lineTo(turret.x - 10, H - 44);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#525f86"; ctx.fillRect(turret.x - 8, H - 50, 16, 8);
        // barrel
        ctx.save(); ctx.translate(turret.x, turret.y); ctx.rotate(turret.angle);
        ctx.fillStyle = ACCENT;
        ctx.fillRect(0, -5, 26, 10);
        ctx.fillStyle = "#0d3b2e"; ctx.fillRect(24, -5, 4, 10);
        ctx.restore();
        ctx.fillStyle = "#9fe9cf"; ctx.beginPath(); ctx.arc(turret.x, turret.y, 7, 0, Math.PI * 2); ctx.fill();
      }
      // aim reticle
      ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mouseX - 14, mouseY); ctx.lineTo(mouseX + 14, mouseY);
      ctx.moveTo(mouseX, mouseY - 14); ctx.lineTo(mouseX, mouseY + 14); ctx.stroke();
    }

    // particles
    for (const p of particles) { ctx.globalAlpha = Math.max(0, 1 - p.age / p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
    if (flashRect && flashRect.a > 0.01) { ctx.fillStyle = hexA(flashRect.color, flashRect.a); ctx.fillRect(0, 0, W, H); flashRect.a *= 0.92; }

    // HUD
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.font = "bold 16px system-ui";
    ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("Score " + score, 14, 12);
    ctx.textAlign = "right"; ctx.fillText("♥ " + lives, W - 14, 12);
    ctx.fillStyle = "#bfe6a0"; ctx.textAlign = "center"; ctx.fillText("✓ " + correct + "  " + FROM, W / 2, 12);
    if (combo >= 2) { ctx.fillStyle = "#ffcf33"; ctx.fillText("🔥 x" + combo, W / 2, 32); }
    if (wordsLeft > 0) { ctx.fillStyle = "#cdd6f4"; ctx.fillText("📚 words left: " + wordsLeft, W / 2, 52); }

    if (state === "menu") {
      drawScreen("🛡️ Vocab Defender",
        ["A ground turret — click / tap to fire at the cursor!",
         highscore > 0 ? "🏆 Best Score: " + highscore : "No high score yet — be the first!",
         "Aim with the mouse · hold to keep firing · Space also fires",
         "❓ saucers quiz you · saucers that reach the ground MUTATE — clear them all to win"],
        "Tap the screen or press any key to start", "#12b886");
    } else if (state === "over") {
      const newHs = score >= highscore && score > 0;
      drawScreen(lastWin ? "🏆 YOU WIN!" : "💀 GAME OVER",
        [(lastWin ? "Saucers cleared and words learned!" : "Your turret was destroyed!"),
         "📖 Words correct: " + correct,
         "Final Score: " + score + (newHs ? "   🏆 NEW!" : ""),
         highscore > 0 ? "🏆 Best: " + highscore : ""].filter(Boolean),
        "↺ Play again  (tap screen or press any key)", lastWin ? "#ffe08a" : "#ff8a8a");
    }
  }

  function drawScreen(title, lines, footer, titleColor) {
    ctx.fillStyle = "rgba(3,5,12,0.72)"; ctx.fillRect(0, 0, W, H);
    const pw = 480, ph = 300, px = (W - pw) / 2, py = (H - ph) / 2;
    roundRect(px, py, pw, ph, 16);
    ctx.fillStyle = "rgba(13,17,28,0.97)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = ACCENT; ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = titleColor || ACCENT; ctx.font = "bold 33px system-ui, sans-serif"; ctx.fillText(title, W / 2, py + 56);
    ctx.fillStyle = "#dfe6ff"; ctx.font = "15px system-ui, sans-serif";
    let y = py + 108;
    for (let i = 0; i < lines.length; i++) { ctx.fillText(lines[i], W / 2, y); y += 28; }
    ctx.fillStyle = ACCENT; ctx.font = "bold 17px system-ui, sans-serif"; ctx.fillText(footer, W / 2, py + ph - 34);
    ctx.textAlign = "left";
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function hexA(hex, a) {
    const h = hex.replace("#", "");
    return "rgba(" + parseInt(h.substr(0, 2), 16) + "," + parseInt(h.substr(2, 2), 16) + "," + parseInt(h.substr(4, 2), 16) + "," + a + ")";
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt); draw(dt); requestAnimationFrame(frame);
  }
  E.send(E.MSG.READY);

  // ── test seam (used only by test_defender.js; inert in normal play) ──
  if (window.__DEF_TEST__) {
    window.__def = {
      getState: function () { return state; },
      lives: function () { return lives; },
      diff: function () { return diff(); },
      waveNo: function () { return waveNo; },
      waveSize: function () { return landers.length; },
      score: function () { return score; },
      setScore: function (s) { score = s; },
      vocabOrder: function () { return VOCAB.map(function (w) { return w.from; }); },
      restart: function () { startGame(); },
      mutants: function () { return landers.filter(function (l) { return l.alive && l.isMutant; }).length; },
      hitEdu: function (isCorrect) {
        const L = landers.find(function (x) { return x.alive; });
        if (!L) return state;
        // force this lander to be the educational one so the quiz always triggers
        const e = VOCAB[Math.min(wordsAnswered, VOCAB.length - 1)];
        L.edu = true; L.word = e ? e.from : "word"; L.correct = e ? e.correct : "x"; L.options = e ? E.buildOptions(e).options : ["x"];
        awaitingAnswer = true; quizLander = L; state = "paused";
        onAnswer(isCorrect);
        return state;
      },
    };
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

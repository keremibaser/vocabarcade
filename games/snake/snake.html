<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Vocab Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1e2e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  #c { display: block; width: 100vmin; height: 75vmin; max-width: 100vw; max-height: 100vh;
       touch-action: none; border-radius: 12px;
       border: 3px solid rgba(100,200,160,0.3);
       box-shadow: 0 0 40px rgba(12,166,120,0.15), 0 0 80px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../js/engine-common.js"></script>
<script>
(function () {
  "use strict";
  const E = window.VocabEngine;

  const launch = E.readLaunch() || { vocab: [], fromLang: "Word", toLang: "Meaning", accent: "#0ca678" };
  const Sfx = E.sfx({ enabled: launch.sound !== false });
  let VOCAB = E.shuffle(launch.vocab || []);
  const FROM = launch.fromLang || "Word";
  const TO = launch.toLang || "Meaning";
  const ACCENT = launch.accent || "#0ca678";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 800, H = 600;
  // crisp at any screen size: backing store = real on-screen pixels, drawing
  // stays in logical 800x600 units (see E.fitCanvas)
  function resize() { E.fitCanvas(canvas, ctx, W, H); }
  window.addEventListener("resize", resize); resize();

  // ---- grid ----
  const CELL = 20;
  const GW = Math.floor(W / CELL), GH = Math.floor(H / CELL); // 40 x 30

  // ---- state ----
  let state = "menu";
  let score = 0, lives = 3, correct = 0, combo = 0, speedLevel = 0;
  let totalWords = 0, wordsLeft = 0;
  let snake = [], food = null, particles = [], flashRect = null;
  let quizFood = null, awaitingAnswer = false;
  let dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 };
  let stepAcc = 0, stepInterval = 0.19;
  let foodCount = 0;                       // persistent -> ~1/3 of apples are educational
  let wordQueue = [];

  const SPEED_THR = [120, 300, 520, 800, 1100];
  // high score (mirrors the breakout / invaders design)
  const HS_KEY = "vocabarcade.snake.highscore";
  let highscore = 0, lastWin = false;
  try { highscore = parseInt(localStorage.getItem(HS_KEY) || "0", 10) || 0; } catch (_) {}
  function saveHighscore(s) { try { localStorage.setItem(HS_KEY, String(s)); } catch (_) {} }

  function recomputeSpeed() {
    // slower base cadence; each level speeds up a touch, floored so it never gets frantic
    stepInterval = Math.max(0.10, 0.19 - speedLevel * 0.018);
  }

  function emitHud() { E.send(E.MSG.HUD, { score, lives, correct, combo, level: speedLevel }); }
  function flash(color, a) { flashRect = { color, a }; }
  function addScore(p) {
    score += p;
    if (speedLevel < SPEED_THR.length && score >= SPEED_THR[speedLevel]) {
      speedLevel++; flash("#8a3ffc", 0.26); recomputeSpeed();
    }
    emitHud();
  }

  // ---- input ----
  const keys = {};
  let pointerX = null, pointerY = null, pointerDown = false;
  function setPointer(e) {
    const rect = canvas.getBoundingClientRect();
    pointerX = ((e.clientX - rect.left) / rect.width) * W;
    pointerY = ((e.clientY - rect.top) / rect.height) * H;
  }
  function setDir(x, y) {
    // can't reverse directly into yourself
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }
  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (["arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
    if (k === "arrowleft" || k === "a") setDir(-1, 0);
    else if (k === "arrowright" || k === "d") setDir(1, 0);
    else if (k === "arrowup" || k === "w") setDir(0, -1);
    else if (k === "arrowdown" || k === "s") setDir(0, 1);
    // any key starts / restarts from menu or game-over
    if (state === "menu" || state === "over") startGame();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("pointermove", function (e) { setPointer(e); });
  window.addEventListener("pointerdown", function (e) {
    if (state === "menu" || state === "over") { startGame(); return; }
    // ship follows the mouse ONLY while the button is pressed on the playfield
    if (e.target === canvas) { pointerDown = true; setPointer(e); }
  });
  window.addEventListener("pointerup", function () { pointerDown = false; });
  window.addEventListener("pointercancel", function () { pointerDown = false; });

  E.listen(function (msg) {
    if (msg.type === E.MSG.START) startGame();
    else if (msg.type === E.MSG.PAUSE) { if (state === "playing") state = "paused"; }
    else if (msg.type === E.MSG.RESUME) { if (state === "paused") state = "playing"; }
    else if (msg.type === E.MSG.QUIT) state = "menu";
    else if (msg.type === E.MSG.ANSWER) onAnswer(msg.correct);
  });

  // the game-over screen stays up for a moment — a stray smartboard tap must not
  // skip past it (see E.overGuard in engine-common)
  const OverLock = E.overGuard(2000);
  function startGame() {
    if (OverLock.live()) return;
    VOCAB = E.shuffle(launch.vocab || []);   // fresh question order on every run / restart
    score = 0; lives = 3; correct = 0; combo = 0; speedLevel = 0;
    snake = [{ x: 10, y: 15 }, { x: 9, y: 15 }, { x: 8, y: 15 }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    stepAcc = 0; recomputeSpeed();
    particles = []; flashRect = null; awaitingAnswer = false; quizFood = null;
    wordQueue = E.shuffle(VOCAB.slice());
    totalWords = VOCAB.length; wordsLeft = VOCAB.length;
    spawnFood();
    state = "playing";
    emitHud();
  }

  function occupied(x, y) {
    if (food && food.x === x && food.y === y) return true;
    for (const s of snake) if (s.x === x && s.y === y) return true;
    return false;
  }
  function spawnFood() {
    // pick a random empty cell
    let x, y, tries = 0;
    do { x = Math.floor(Math.random() * GW); y = Math.floor(Math.random() * GH); tries++; }
    while (occupied(x, y) && tries < 500);
    const edu = wordsLeft > 0 && (foodCount % 3 === 0) && wordQueue.length > 0;
    foodCount++;
    if (edu) {
      const e = wordQueue[0];
      food = { x, y, edu: true, word: e.from, correct: e.correct, options: E.buildOptions(e).options };
    } else {
      food = { x, y, edu: false, word: "", correct: "", options: [] };
    }
  }

  function onAnswer(isCorrect) {
    awaitingAnswer = false;
    const f = quizFood; quizFood = null;
    if (!f) { state = "playing"; return; }
    if (isCorrect) {
      correct++; combo++; addScore(20);
      if (combo >= 2) addScore((combo - 1) * 10);
      flash("#22c55e", 0.3);
      E.send(E.MSG.EVENT, { name: "correct" });
      // consume one word from the queue
      if (wordQueue.length) wordQueue.shift();
      wordsLeft = wordQueue.length;
      spawnParticles(f.x * CELL + CELL / 2, f.y * CELL + CELL / 2, "#ffd56b");
      if (wordsLeft <= 0) { gameOver(true); return; }   // all words answered -> WIN
      spawnFood();
      emitHud();
      state = "playing";              // resume (fixes the freeze-after-answer bug)
    } else {
      combo = 0; lives--; flash("#ef4444", 0.42);
      E.send(E.MSG.EVENT, { name: "wrong" });
      emitHud();
      if (lives <= 0) { gameOver(false); return; }
      spawnFood();                     // word stays in the queue -> will come up again
      state = "playing";
    }
  }

  function step() {
    dir = nextDir;
    const head = snake[0];
    let nx = head.x + dir.x, ny = head.y + dir.y;
    // walls wrap around (block by block) instead of killing the snake
    if (nx < 0) nx = GW - 1; else if (nx >= GW) nx = 0;
    if (ny < 0) ny = GH - 1; else if (ny >= GH) ny = 0;
    const willGrow = food && nx === food.x && ny === food.y;
    // self collision (skip the tail cell unless we're growing into it)
    for (let i = 0; i < snake.length; i++) {
      if (i === snake.length - 1 && !willGrow) continue;
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(false); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (willGrow) onEatFood();
    else snake.pop();
  }

  function onEatFood() {
    if (food.edu) {
      awaitingAnswer = true; quizFood = food; state = "paused";
      E.send(E.MSG.ASK, { word: food.word, correct: food.correct, options: food.options });
      Sfx.edu();
      // food stays "eaten"; a fresh one is spawned after the answer
    } else {
      addScore(10);
      spawnParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, "#ff7a7a");
      spawnFood();
      Sfx.pickup();
    }
  }

  function gameOver(win) {
    state = "over"; OverLock.arm(); lastWin = win;
    if (score > highscore) { highscore = score; saveHighscore(highscore); }
    E.send(E.MSG.RESULT, { win, score, correct, total: totalWords });
    E.send(E.MSG.EVENT, { name: win ? "win" : "lose" });
    flash(win ? "#eab308" : "#ef4444", 0.5);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20, life: 0.45, age: 0, color, size: 2 + Math.random() * 3 });
    }
  }

  function update(dt) {
    if (state !== "playing") return;

    // mouse steering (only while the button is held, like Invaders)
    if (pointerDown && pointerX != null && pointerY != null && snake.length) {
      const hx = snake[0].x * CELL + CELL / 2, hy = snake[0].y * CELL + CELL / 2;
      const dx = pointerX - hx, dy = pointerY - hy;
      if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > CELL * 0.5) setDir(dx > 0 ? 1 : -1, 0); }
      else { if (Math.abs(dy) > CELL * 0.5) setDir(0, dy > 0 ? 1 : -1); }
    }

    // advance the snake on a fixed cadence (scales with score)
    stepAcc += dt;
    if (stepAcc >= stepInterval) {
      stepAcc -= stepInterval;
      step();
      if (state !== "playing") return;   // ate an educational apple (paused) or died
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt; p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.age >= p.life) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ---- background: softer, more visible ----
    ctx.fillStyle = "#141824"; ctx.fillRect(0, 0, W, H);

    // checkerboard grid for easy cell visibility
    for (let gx = 0; gx < GW; gx++) {
      for (let gy = 0; gy < GH; gy++) {
        if ((gx + gy) % 2 === 0) {
          ctx.fillStyle = "rgba(40,210,160,0.045)";
          ctx.fillRect(gx * CELL, gy * CELL, CELL, CELL);
        }
      }
    }
    // grid lines
    ctx.strokeStyle = "rgba(80,220,170,0.10)"; ctx.lineWidth = 1;
    for (let x = CELL; x < W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = CELL; y < H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // border glow around playfield
    ctx.strokeStyle = "rgba(80,220,170,0.18)"; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    // food
    if (food) {
      const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
      if (food.edu) {
        // pulsating glow for educational food
        const pulse = Math.sin(performance.now() / 200);
        const pr = CELL * 0.46 + pulse * 2;
        ctx.shadowColor = "#ffd56b"; ctx.shadowBlur = 14 + pulse * 4;
        ctx.fillStyle = "#ffe066";
        ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#2a1f00"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("?", cx, cy + 1);
      } else {
        // bright red apple with glow
        ctx.shadowColor = "#ff5050"; ctx.shadowBlur = 10;
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        // apple highlight
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath(); ctx.arc(cx - 2, cy - 3, CELL * 0.15, 0, Math.PI * 2); ctx.fill();
      }
    }

    // snake — brighter, more visible with glow
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const isHead = i === 0;
      const alpha = 0.65 + 0.35 * (1 - i / Math.max(1, snake.length));
      if (isHead) {
        ctx.shadowColor = ACCENT; ctx.shadowBlur = 12;
      }
      ctx.fillStyle = isHead ? lightenHex(ACCENT, 30) : hexA(ACCENT, alpha);
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, isHead ? 7 : 5); ctx.fill();
      ctx.shadowBlur = 0;
      // segment border for definition
      ctx.strokeStyle = hexA(ACCENT, 0.35); ctx.lineWidth = 1; ctx.stroke();
      if (isHead) {
        // brighter eyes
        ctx.fillStyle = "#ffffff";
        const ex = s.x * CELL + CELL / 2, ey = s.y * CELL + CELL / 2;
        ctx.beginPath(); ctx.arc(ex - 4 + dir.x * 3, ey - 3 + dir.y * 3, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 4 + dir.x * 3, ey - 3 + dir.y * 3, 2.5, 0, Math.PI * 2); ctx.fill();
        // pupils
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(ex - 4 + dir.x * 4, ey - 3 + dir.y * 4, 1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 4 + dir.x * 4, ey - 3 + dir.y * 4, 1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // flash
    if (flashRect && flashRect.a > 0.01) {
      ctx.fillStyle = hexA(flashRect.color, flashRect.a);
      ctx.fillRect(0, 0, W, H); flashRect.a *= 0.92;
    }

    // HUD — bigger, more readable with shadow
    ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 4;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px system-ui";
    ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("Score " + score, 14, 12);
    ctx.textAlign = "right"; ctx.fillText("♥ " + lives, W - 14, 12);
    ctx.fillStyle = "#a0f0c0"; ctx.textAlign = "center"; ctx.fillText("✓ " + correct + "  " + FROM, W / 2, 12);
    if (wordsLeft > 0) { ctx.fillStyle = "#ffe066"; ctx.fillText("📚 " + wordsLeft + " words left", W / 2, 34); }
    if (combo >= 2) { ctx.fillStyle = "#ffcf33"; ctx.fillText("🔥 x" + combo, W / 2, 56); }
    if (speedLevel > 0) { ctx.fillStyle = "#c4a8ff"; ctx.fillText("⚡ Lv." + speedLevel, W / 2, 78); }
    ctx.shadowBlur = 0;

    // ---- start / game-over screens (same design as breakout / invaders) ----
    if (state === "menu") {
      drawScreen("🐍 Vocab Snake",
        ["Eat the apples — answer the words!",
         highscore > 0 ? "🏆 Best Score: " + highscore : "No high score yet — be the first!",
         "Swipe or use the ◀ ▲ ▶ ▼ buttons to steer",
         "Keyboard: Arrow keys / W A S D",
         "Walls wrap around — you slip out the far side",
         "Eat a ❓ apple to answer a word ·  clear all words to win"],
        "Tap the screen or press any key to start", "#ffd56b");
    } else if (state === "over") {
      const newHs = score >= highscore && score > 0;
      drawScreen(lastWin ? "🏆 YOU WIN!" : "💀 GAME OVER",
        [(lastWin ? "All words learned!" : "The snake crashed!"),
         "📖 Words correct: " + correct,
         "Final Score: " + score + (newHs ? "   🏆 NEW!" : ""),
         highscore > 0 ? "🏆 Best: " + highscore : ""].filter(Boolean),
        "↺ Play again  (tap screen or press any key)", lastWin ? "#ffe08a" : "#ff8a8a");
    }
  }

  // centered styled panel (matches breakout's / invaders' drawScreen)
  function drawScreen(title, lines, footer, titleColor) {
    ctx.fillStyle = "rgba(3,5,12,0.72)"; ctx.fillRect(0, 0, W, H);
    const pw = 470, ph = 300, px = (W - pw) / 2, py = (H - ph) / 2;
    roundRect(px, py, pw, ph, 16);
    ctx.fillStyle = "rgba(13,17,28,0.97)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = ACCENT; ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = titleColor || ACCENT;
    ctx.font = "bold 33px system-ui, sans-serif";
    ctx.fillText(title, W / 2, py + 56);
    ctx.fillStyle = "#dfe6ff"; ctx.font = "15px system-ui, sans-serif";
    let y = py + 108;
    for (let i = 0; i < lines.length; i++) { ctx.fillText(lines[i], W / 2, y); y += 28; }
    ctx.fillStyle = ACCENT; ctx.font = "bold 17px system-ui, sans-serif";
    ctx.fillText(footer, W / 2, py + ph - 34);
    ctx.textAlign = "left";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function hexA(hex, a) {
    const h = hex.replace("#", "");
    return "rgba(" + parseInt(h.substr(0, 2), 16) + "," + parseInt(h.substr(2, 2), 16) + "," + parseInt(h.substr(4, 2), 16) + "," + a + ")";
  }
  function lightenHex(hex, amt) {
    const h = hex.replace("#", "");
    var r = Math.min(255, parseInt(h.substr(0, 2), 16) + amt);
    var g = Math.min(255, parseInt(h.substr(2, 2), 16) + amt);
    var b = Math.min(255, parseInt(h.substr(4, 2), 16) + amt);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  E.send(E.MSG.READY);

  // ── on-screen touch controls: centered bottom D-pad + swipe gestures ──
  // Big buttons for kids' fingers + swipe anywhere on canvas to steer.
  (function mountSnakeControls() {
    // ---- SWIPE GESTURE on canvas ----
    let swipeStartX = null, swipeStartY = null;
    const SWIPE_THRESHOLD = 20; // px minimum to count as swipe
    canvas.addEventListener("touchstart", function (e) {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });
    canvas.addEventListener("touchmove", function (e) {
      if (swipeStartX === null || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - swipeStartX;
      const dy = e.touches[0].clientY - swipeStartY;
      if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
      // decide direction
      if (Math.abs(dx) > Math.abs(dy)) {
        setDir(dx > 0 ? 1 : -1, 0);
      } else {
        setDir(0, dy > 0 ? 1 : -1);
      }
      // reset so continuous swiping works
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener("touchend", function () { swipeStartX = null; swipeStartY = null; }, { passive: true });

    // ---- D-PAD BUTTONS ----
    const css =
      ".snake-tc{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:50;display:grid;gap:6px;" +
      "grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);" +
      "touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:none;opacity:0.78;}" +
      ".snake-tc .tc{appearance:none;border:0;cursor:pointer;color:#fff;font-weight:700;" +
      "font-size:28px;line-height:1;border-radius:16px;background:rgba(50,60,100,0.92);" +
      "box-shadow:0 4px 0 rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.12);" +
      "border:2px solid rgba(255,255,255,0.15);touch-action:none;user-select:none;-webkit-user-select:none;" +
      "pointer-events:auto;transition:transform .04s ease,background .1s ease;}" +
      ".snake-tc .tc:active{transform:translateY(3px);background:rgba(112,72,232,0.95);box-shadow:0 1px 0 rgba(0,0,0,0.4);}" +
      ".snake-tc .sp{visibility:hidden;pointer-events:none;}";
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    const wrap = document.createElement("div"); wrap.className = "snake-tc";
    const mk = function (label, cls, x, y) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tc " + cls; b.innerHTML = label;
      let held = false;
      const press = function (e) { if (held) return; held = true;
        if (e.pointerId != null && b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (_) {} }
        e.preventDefault(); e.stopPropagation(); setDir(x, y);
        if (state === "menu" || state === "over") startGame();
      };
      const release = function (e) { if (!held) return; held = false;
        if (e && e.pointerId != null && b.releasePointerCapture) { try { b.releasePointerCapture(e.pointerId); } catch (_) {} } };
      b.addEventListener("pointerdown", press);
      b.addEventListener("pointerup", release);
      b.addEventListener("pointercancel", release);
      b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      return b;
    };
    // Row 1: left, up, right
    const left = mk("◀", "", -1, 0);
    const up = mk("▲", "", 0, -1);
    const right = mk("▶", "", 1, 0);
    // Row 2: spacer, down, spacer
    const sp1 = document.createElement("span"); sp1.className = "tc sp";
    const down = mk("▼", "", 0, 1);
    const sp2 = document.createElement("span"); sp2.className = "tc sp";
    wrap.appendChild(left); wrap.appendChild(up); wrap.appendChild(right);
    wrap.appendChild(sp1); wrap.appendChild(down); wrap.appendChild(sp2);
    document.body.appendChild(wrap);
  })();

  // ── test seam (used only by test_snake.js; inert in normal play) ──
  if (window.__SNAKE_TEST__) {
    window.__snake = {
      getState: function () { return state; },
      lives: function () { return lives; },
      wordsLeft: function () { return wordsLeft; },
      head: function () { return { x: snake[0].x, y: snake[0].y }; },
      speed: function () { return stepInterval; },
      food: function () { return food ? { x: food.x, y: food.y } : null; },
      setDir: function (x, y) { setDir(x, y); },
      hitEdu: function (isCorrect) {
        if (wordsLeft <= 0) return state;
        food = { x: snake[0].x, y: snake[0].y, edu: true,
          word: wordQueue[0].from, correct: wordQueue[0].correct, options: E.buildOptions(wordQueue[0]).options };
        awaitingAnswer = true; quizFood = food; state = "paused";
        onAnswer(isCorrect);
        return state;
      },
      // drive one deterministic step from a placed head with a forced direction
      // (single-cell snake, no food) so wall wrapping can be asserted directly
      stepFrom: function (x, y, dx, dy) {
        snake = [{ x: x, y: y }];
        food = null; particles = []; awaitingAnswer = false; quizFood = null;
        dir = { x: dx, y: dy }; nextDir = { x: dx, y: dy };
        step();
        return { x: snake[0].x, y: snake[0].y, state: state };
      },
    };
  }

  requestAnimationFrame(frame);
})();
</script>
